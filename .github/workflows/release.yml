name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: linux-aarch64
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ARCHIVE_NAME="vela-${VERSION}-${{ matrix.artifact }}"
          mkdir -p "${ARCHIVE_NAME}"
          cp target/${{ matrix.target }}/release/vela "${ARCHIVE_NAME}/"
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          else
            sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            vela-*.tar.gz
            vela-*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/vela-*.tar.gz
            artifacts/vela-*.tar.gz.sha256

      - name: Generate Homebrew formula
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          MACOS_ARM_SHA256=$(cat artifacts/vela-*-macos-aarch64.tar.gz.sha256 | awk '{print $1}')
          MACOS_X86_SHA256=$(cat artifacts/vela-*-macos-x86_64.tar.gz.sha256 | awk '{print $1}')
          LINUX_ARM_SHA256=$(cat artifacts/vela-*-linux-aarch64.tar.gz.sha256 | awk '{print $1}')
          LINUX_X86_SHA256=$(cat artifacts/vela-*-linux-x86_64.tar.gz.sha256 | awk '{print $1}')

          sed \
            -e "s|{{VERSION}}|${VERSION}|g" \
            -e "s|{{MACOS_ARM_SHA256}}|${MACOS_ARM_SHA256}|g" \
            -e "s|{{MACOS_X86_SHA256}}|${MACOS_X86_SHA256}|g" \
            -e "s|{{LINUX_ARM_SHA256}}|${LINUX_ARM_SHA256}|g" \
            -e "s|{{LINUX_X86_SHA256}}|${LINUX_X86_SHA256}|g" \
            packaging/homebrew/vela.rb.template > vela.rb

      - name: Push to Homebrew tap
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        with:
          source_file: vela.rb
          destination_repo: mizzy/homebrew-tap
          destination_folder: Formula
          destination_branch: main
          user_email: github-actions[bot]@users.noreply.github.com
          user_name: github-actions[bot]
          commit_message: "Update vela to ${{ github.ref_name }}"
